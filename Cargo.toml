[package]
name = "rusidian"
version = "0.1.0"
edition = "2024"

[features]
default = ["runtime-shaders"]
# For development on Macs without the standalone Metal compiler.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
dirs = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d9e1c024f393832765a03f4de204d6c8cd9abcb2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9e1c024f393832765a03f4de204d6c8cd9abcb2", features = ["font-kit"] }
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["io-util", "process", "rt", "sync", "time"] }
