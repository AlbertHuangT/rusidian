[package]
name = "rusidian"
version = "0.0.1"
edition = "2024"

[features]
default = ["runtime-shaders"]
# For development on Macs without the standalone Metal compiler.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
cargo-packager-updater = "=0.2.3"
dirs = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d9e1c024f393832765a03f4de204d6c8cd9abcb2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9e1c024f393832765a03f4de204d6c8cd9abcb2", features = ["font-kit"] }
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
pulldown-cmark = "0.13.4"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
# Already built for the updater; used to fetch remote images the user chooses to load.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# Keep RaTeX fonts self-contained in debug builds, too (feature unification).
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["io-util", "process", "rt", "sync", "time"] }
ttf-parser = "0.25.1"
unicode-linebreak = "0.1.5"

# GPUI's Linux platform needs at least one windowing backend; macOS builds are unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d9e1c024f393832765a03f4de204d6c8cd9abcb2", features = ["font-kit", "wayland", "x11"] }
