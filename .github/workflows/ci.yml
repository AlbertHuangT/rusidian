name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check package version
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Packager.toml)" = "$version"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Install integration dependencies
        run: brew install neovim tectonic
      - name: Neovim and Tectonic integration tests
        run: cargo test --locked -- --ignored --test-threads=1
      - name: Install macOS packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package macOS app
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-macos.sh
      - name: Verify macOS app
        run: |
          test -x dist/Rusidian.app/Contents/MacOS/rusidian
          file dist/Rusidian.app/Contents/MacOS/rusidian | grep -q arm64
          plutil -extract CFBundleIdentifier raw dist/Rusidian.app/Contents/Info.plist | grep -qx com.alberthuang.rusidian
          codesign --verify --deep --strict --verbose=2 dist/Rusidian.app
          hdiutil verify dist/Rusidian_*.dmg
          otool -L dist/Rusidian.app/Contents/MacOS/rusidian
      - name: Prepare release assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! test -f dist/Rusidian.app.tar.gz; then
            COPYFILE_DISABLE=1 tar -czf dist/Rusidian.app.tar.gz -C dist Rusidian.app
          fi
          version=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          cp "dist/Rusidian_${version}_aarch64.dmg" dist/Rusidian.dmg
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -exec shasum -a 256 {} \; | sed 's#  \./#  #') > dist/SHA256SUMS
          if [[ "$EVENT_NAME" == push ]]; then
            test -s dist/Rusidian.app.tar.gz.sig
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              release_tag="$RELEASE_TAG"
            else
              release_tag=nightly
            fi
            signature=$(cat dist/Rusidian.app.tar.gz.sig)
            jq -n \
              --arg version "$version" \
              --arg signature "$signature" \
              --arg url "https://github.com/$REPOSITORY/releases/download/$release_tag/Rusidian.app.tar.gz" \
              '{version: $version, platforms: {"macos-aarch64": {signature: $signature, url: $url, format: "app"}}}' \
              > dist/latest.json
          fi
      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rusidian-macos-arm64-${{ github.sha }}
          path: |
            dist/Rusidian.app.tar.gz
            dist/Rusidian.app.tar.gz.sig
            dist/Rusidian_*.dmg
            dist/Rusidian.dmg
            dist/Rusidian_*.dmg.sig
            dist/latest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rusidian-macos-arm64-${{ github.sha }}
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" --verify-tag \
                --title "Rusidian $release_tag" \
                --generate-notes
            fi
          else
            release_tag=nightly
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --title "Rusidian nightly" \
                --notes "Automated Apple Silicon build from $GITHUB_SHA."
            else
              gh release create "$release_tag" --target "$GITHUB_SHA" --prerelease \
                --title "Rusidian nightly" \
                --notes "Automated Apple Silicon build from $GITHUB_SHA."
            fi
          fi
          gh release upload "$release_tag" dist/* --clobber
