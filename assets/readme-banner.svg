<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Rusidian — Your notes. Your Neovim.</title>
  <desc id="desc">Local Markdown files connect real Neovim editing with a dedicated native reading view.</desc>
